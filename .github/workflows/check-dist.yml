# Lints, tests and rebuilds the action, then fails if the committed dist/
# does not match the build. Users run dist/, not node_modules, so a
# dependency or source change is not shipped until dist/ is rebuilt.
#
# If this fails on a Dependabot PR, check out the branch, run
# `npm ci && npm run package`, then commit and push dist/.
name: Check dist

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build dist
        run: npm run package

      - name: Compare dist with the build
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'npm ci && npm run package' and commit the result."
            git status --short -- dist/
            git diff --stat -- dist/
            exit 1
          fi
